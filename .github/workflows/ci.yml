name: CI

on:
  push:
    branches:
      - main
      - feat/iteration-1-streamlit-foundation
      - feat/milestone-a-postgres-persistence
      - feat/milestone-b-repository-intelligence-comparison
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Validate database migration
        working-directory: backend
        run: |
          mkdir -p .local
          DATABASE_URL=sqlite:///./.local/migration-check.db alembic upgrade head
      - name: Run API tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
